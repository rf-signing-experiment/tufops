[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
tufops-core = { path = "crates/tufops-core" }
tufops-cloud = { path = "crates/tufops-cloud" }

anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = "0.12.0"
futures-util = "0.3.34"
google-cloud-kms-v1 = "1.15.0"
google-cloud-storage = "1.20.0"
md-5 = "0.11.0"
octocrab = { version = "0.54.2", default-features = false, features = [
    "default-client", "follow-redirect", "jwt-aws-lc-rs", "retry", "rustls", "rustls-aws-lc-rs", "timeout",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tuf = { git = "https://github.com/rf-signing-experiment/rust-tuf.git", branch = "review-stack" }
url = "2.5.8"
walkdir = "2.5.0"
x509-cert = "0.2.5"
yubikey = "0.8.0"
zeroize = "1.9.0"

[profile.release]
lto = "thin"